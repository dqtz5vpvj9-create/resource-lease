[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "resource-lease"
version = "0.1.0"
description = "Daemonless local named resource leases with owner metadata and namespace listing."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "AutoDroid contributors" },
]
keywords = ["lease", "lock", "ipc", "mutex", "coordination", "abstract-socket"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
win32 = ["pywin32>=306"]
dev = [
    "coverage>=7.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.6",
]

[dependency-groups]
dev = [
    "coverage>=7.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.6",
]

[project.scripts]
resource-lease = "resource_lease.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["resource_lease"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-p no:xdist"

[tool.coverage.run]
parallel = false

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Keep pyupgrade out while the package supports Python 3.9: many UP rules
# rewrite annotations to Python 3.10+ syntax.
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["resource_lease"]

[tool.mypy]
python_version = "3.9"
packages = ["resource_lease"]
ignore_missing_imports = true
