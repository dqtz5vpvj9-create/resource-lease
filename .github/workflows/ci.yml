name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  dist:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-suffix: dist-3.13
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: uv build
      - name: Smoke install wheel
        run: |
          uv venv
          uv pip install dist/*.whl
          uv run resource-lease --help

  linux:
    name: Linux common backend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-suffix: linux-${{ matrix.python-version }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --python ${{ matrix.python-version }} --group dev
      - name: Lint
        run: uv run ruff check resource_lease tests
      - name: Coverage
        run: |
          uv run coverage run --source=resource_lease --omit='resource_lease/backends/win_mutex.py' -m pytest tests/resource_lease -q
          uv run coverage report --fail-under=100 --omit='resource_lease/backends/win_mutex.py'

  windows:
    name: Windows mutex backend
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-suffix: windows-${{ matrix.python-version }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --python ${{ matrix.python-version }} --group dev --extra win32
      - name: Coverage
        shell: pwsh
        run: |
          uv run coverage run --source=resource_lease.backends.win_mutex -m pytest tests/resource_lease/test_win_mutex.py tests/resource_lease/test_win_mutex_coverage.py -q
          uv run coverage report --fail-under=100
