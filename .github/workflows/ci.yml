name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    name: Linux common backend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check resource_lease tests
      - name: Coverage
        run: |
          python -m coverage run --source=resource_lease --omit='resource_lease/backends/win_mutex.py' -m pytest tests/resource_lease -q
          python -m coverage report --fail-under=100 --omit='resource_lease/backends/win_mutex.py'

  windows:
    name: Windows mutex backend
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,win32]"
      - name: Coverage
        shell: pwsh
        run: |
          python -m coverage run --source=resource_lease.backends.win_mutex -m pytest tests/resource_lease/test_win_mutex.py tests/resource_lease/test_win_mutex_coverage.py -q
          python -m coverage report --fail-under=100
